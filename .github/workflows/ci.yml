name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: 테스트
        run: ./gradlew test --no-daemon
      - name: 테스트 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  # 운영 설정 그대로 실제 MySQL에 붙여 Flyway 마이그레이션과 엔티티가 맞는지 확인
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bandmong
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/bandmong
      DB_USERNAME: root
      DB_PASSWORD: root
      DEV_LOGIN: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: MySQL 마이그레이션 검증
        run: ./gradlew test --tests '*MySqlMigrationTest' --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 테스트
        run: npm test
      - name: 빌드
        run: npm run build

  # main에 들어온 코드가 테스트를 모두 통과하면 Docker 이미지를 만들어 GHCR에 올린다
  # (태그: latest + 커밋 sha → 문제가 생기면 이전 sha로 되돌려 배포)
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, mysql, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bandmong-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/bandmong-${{ matrix.app }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
