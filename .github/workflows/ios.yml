name: iOS TestFlight

# 손으로 눌러서 실행: 맥 없이 GitHub의 macOS 머신에서 앱을 빌드해 TestFlight에 올린다.
# 필요한 설정은 docs/ios-release.md 참고.
on:
  workflow_dispatch:
    inputs:
      version:
        description: '앱 버전 (예: 1.0.0). 비우면 프로젝트 값 그대로'
        required: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 설정 확인
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          API_BASE: ${{ vars.API_BASE }}
        run: |
          missing=()
          for name in ASC_KEY_ID ASC_ISSUER_ID TEAM_ID ASC_KEY_P8 GOOGLE_SERVICE_INFO_PLIST API_BASE; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::저장소 Settings > Secrets and variables > Actions 에 다음을 넣어 주세요: ${missing[*]} (API_BASE는 Variables 탭, 나머지는 Secrets 탭 · docs/ios-release.md 2단계)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 웹 화면 빌드 (앱이 부를 서버 주소를 넣어서)
        env:
          VITE_API_BASE: ${{ vars.API_BASE }}
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Firebase 설정과 App Store Connect 키 넣기
        env:
          GSI: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          echo "$GSI" | base64 --decode > ios/App/App/GoogleService-Info.plist
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          plutil -replace teamID -string "$TEAM_ID" ios/ExportOptions.plist

      - name: 아카이브 (서명은 Xcode가 API 키로 자동 처리)
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          VERSION_ARG=()
          [ -n "$APP_VERSION" ] && VERSION_ARG=(MARKETING_VERSION="$APP_VERSION")
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" "${VERSION_ARG[@]}" \
            | xcbeautify || exit ${PIPESTATUS[0]}

      - name: TestFlight에 올리기
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "### 업로드 완료 (빌드 ${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"
          echo "App Store Connect > TestFlight 에서 처리 끝나면(10~30분) 설치할 수 있어요." >> "$GITHUB_STEP_SUMMARY"

      - name: 키 지우기
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" ios/App/App/GoogleService-Info.plist
