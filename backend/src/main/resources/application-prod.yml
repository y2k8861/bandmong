# 운영: MySQL + Flyway. 값은 모두 환경변수로 넣는다 (코드·저장소에 비밀번호를 적지 않음).
# 소셜 로그인 키는 oauth 프로필(application-oauth.yml)로 따로 켠다: SPRING_PROFILES_ACTIVE=prod,oauth
spring:
  datasource:
    # 예: jdbc:mysql://bandmong.xxxx.ap-northeast-2.rds.amazonaws.com:3306/bandmong
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
  jpa:
    hibernate:
      # 테이블은 Flyway만 바꾼다. 엔티티와 테이블이 어긋나면 서버가 뜨지 않는다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  # 앞단(nginx·Caddy·로드밸런서)이 붙인 X-Forwarded-* 를 믿는다 (https 판단, 리다이렉트 주소)
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 14d
      cookie:
        # https로 운영하면 true. 로컬 docker compose(http)로 띄울 때만 false.
        secure: ${COOKIE_SECURE:true}

bandmong:
  # 운영에서는 끈다. 포트폴리오 데모 서버처럼 누구나 둘러보게 하려면 DEV_LOGIN=true.
  dev-login: ${DEV_LOGIN:false}
  # 관리자 계정 "provider:providerId" (쉼표로 여러 개). 예: kakao:3812345678
  admins: ${ADMINS:}
  # 소셜 로그인 성공 후 돌아갈 주소
  front-url: ${FRONT_URL:/}
