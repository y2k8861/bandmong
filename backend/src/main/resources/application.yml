spring:
  application:
    name: bandmong
  profiles:
    default: dev
  # DB 마이그레이션은 운영(MySQL)에서만. 로컬 H2와 테스트는 엔티티로 테이블을 만든다.
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  servlet:
    session:
      cookie:
        same-site: lax

bandmong:
  # 개발용 로그인(POST /api/dev/login)을 켤지. dev 프로필에서만 true로 둡니다.
  dev-login: false
