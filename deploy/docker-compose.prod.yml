# EC2 서버에서 쓰는 구성. 이미지는 GitHub Actions가 만들어 GHCR에 올린 것을 받는다.
# DB는 RDS(MySQL)를 쓰므로 여기에는 없다. 값은 같은 폴더의 .env 파일에서 읽는다.
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
services:
  backend:
    image: ghcr.io/${GHCR_OWNER}/bandmong-backend:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_OPTS: -Xmx512m -XX:+ExitOnOutOfMemoryError
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  frontend:
    image: ghcr.io/${GHCR_OWNER}/bandmong-frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on: [backend]

  # https 자동 발급·갱신 (Let's Encrypt). 도메인의 A 레코드가 이 서버를 가리켜야 한다.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [frontend]

volumes:
  caddy-data:
