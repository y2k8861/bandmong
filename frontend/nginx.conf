# 브라우저 → (Caddy https) → 이 nginx → 백엔드
# 같은 주소에서 화면과 API를 함께 내보내서, 세션·CSRF 쿠키가 같은 출처로 동작한다 (CORS 설정 불필요).

upstream backend {
    server backend:8080;
}

# 앞단(Caddy)이 붙인 https 정보를 그대로 넘기고, 없으면 지금 연결 기준
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 30m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;

    # 실시간 연결(SSE): 모아 보내지 말고, 오래 열어 둔다
    location = /api/stream {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location ~ ^/(api|oauth2|login/oauth2|actuator/health)(/|$) {
        proxy_pass http://backend;
        proxy_http_version 1.1;
    }

    # 빌드 파일 이름에 해시가 붙어 있으니 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 그 밖의 주소(/bands/3 등)는 React 라우터가 처리
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
